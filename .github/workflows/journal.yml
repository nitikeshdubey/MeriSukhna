name: Journal publication checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-publication.cjs
      - if: github.event_name == 'workflow_dispatch'
        run: node tools/check-publication.cjs --live
